# Asteroids game configuration
# Lines starting with # are comments. Format: key = value
# This is the reference default configuration shipped with the game.
# The game also writes a personal copy of this file to your user config
# directory on first launch (see README for the exact path), which you can
# freely edit; that copy is the one actually loaded at runtime.

# Display
window_width = 1280
window_height = 720
fullscreen = false
vsync = true

# Ship handling
ship_thrust_accel = 260.00
ship_rotation_speed_deg = 220.00
ship_max_speed = 420.00
ship_friction = 0.350
ship_radius = 14.00
ship_invulnerability_time = 2.50
ship_respawn_delay = 1.50

# Weapon
bullet_speed = 620.00
bullet_lifetime = 0.90
fire_cooldown = 0.220
max_bullets_on_screen = 6

# Asteroids
asteroid_large_radius = 48.00
asteroid_medium_radius = 28.00
asteroid_small_radius = 14.00
asteroid_min_speed = 40.00
asteroid_max_speed = 110.00
asteroid_split_count = 2
asteroid_large_score = 20
asteroid_medium_score = 50
asteroid_small_score = 100

# Waves and difficulty
wave_base_asteroid_count = 4
wave_asteroid_increment = 2
wave_start_delay = 2.00

# Lives and scoring
starting_lives = 3
extra_life_score_interval = 10000

# Audio
master_volume = 0.80
sfx_volume = 1.00

# Visuals
starfield_star_count = 160
